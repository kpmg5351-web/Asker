name: Build Hesabaty APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Accept Android SDK licenses
        run: |
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          mkdir -p "$SDK_DIR/licenses"
          printf "\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\n" > "$SDK_DIR/licenses/android-sdk-license"
          printf "\n84831b9409646a918e30573bab4c9c91346d8abd\n" > "$SDK_DIR/licenses/android-sdk-preview-license"
          SDKMANAGER="$(command -v sdkmanager || find "$SDK_DIR/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n1 || true)"
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --sdk_root="$SDK_DIR" --licenses >/dev/null 2>&1 || true
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Restore cached debug keystore (fallback)
        uses: actions/cache@v4
        with:
          path: debug.keystore
          key: hesabaty-debug-keystore-v1

      - name: Prepare debug keystore and env
        run: |
          if [ -f debug.keystore.base64 ]; then
            python3 -c 'import base64; data = open("debug.keystore.base64", "r", encoding="utf-8").read().strip(); open("debug.keystore", "wb").write(base64.b64decode(data))'
          elif [ ! -f debug.keystore ]; then
            keytool -genkeypair -noprompt \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          if [ ! -f .env ] && [ -f .env.example ]; then
            cp .env.example .env
          fi

      - name: Build Hesabaty APK
        run: gradle :app:assembleDebug --no-daemon --no-configuration-cache -Djava.awt.headless=true

      - name: Prepare Hesabaty.apk
        run: cp app/build/outputs/apk/debug/app-debug.apk Hesabaty.apk

      - name: Upload Hesabaty APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Hesabaty-APK
          path: Hesabaty.apk
          if-no-files-found: error

      - name: Publish Direct Download Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Hesabaty Latest APK
          body: "أحدث إصدار جاهز للتثبيت المباشر من تطبيق حساباتي | HESABATY (ملف Hesabaty.apk)."
          files: Hesabaty.apk
          make_latest: true
